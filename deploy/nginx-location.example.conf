# Example only. Include inside a reviewed, separately provisioned server block.
# The surrounding server block must set root to the exact selected dist/ release.
# No listen, TLS, hostname, DNS, or upstream changes are authorized by this file.
index index.html;
location / {
    try_files $uri $uri/ =404;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control no-cache;
}
